[package]
name = "voluntary-internet-access"
version = "0.1.0"
description = "A minimal, security-conscious Mihomo desktop client"
authors = ["cgengqiang-cmyk"]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/cgengqiang-cmyk/voluntary-internet-access"
default-run = "voluntary-internet-access"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "via_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
sha2 = "0.10"
hex = "0.4"

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "rustls", "stream"] }
futures-util = "0.3"
keyring = "=4.1.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
shared_child = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
winreg = "0.55"
